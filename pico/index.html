<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Pico Cam</title>
<style>
:root{--red:#ff3b30;--panel:#39232f;--orange:#ff9800}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--red);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#fff}
body{min-height:100dvh;background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.1),transparent 30%),linear-gradient(#ff453a,#f2352f 75%,#e72d28);overflow-x:hidden}
.app{width:min(100%,480px);min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 24px)}
.camera-shell{width:82%;aspect-ratio:1;margin:0 auto 18px;padding:11px;border-radius:27%;background:#050505;border:3px solid rgba(255,255,255,.22);box-shadow:0 11px 20px rgba(70,0,0,.34),inset 0 0 0 2px rgba(255,79,67,.65);display:grid;place-items:center}
.viewfinder{width:72%;aspect-ratio:1;overflow:hidden;border-radius:22%;background:#111;position:relative}
video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(1)}video.mirror{transform:scaleX(-1)}
.camera-hint{position:absolute;inset:0;display:grid;place-items:center;color:#bbb;font-size:13px;text-align:center;padding:18px}
.controls{display:grid;grid-template-columns:1fr 1.7fr 1fr;align-items:center;gap:18px;width:88%;margin:4px auto 0}
.round{border:0;border-radius:50%;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 7px 14px rgba(80,0,0,.3),inset 0 0 0 2px rgba(0,0,0,.32)}
.flash-btn{width:65px;justify-self:start;background:#6f8437;color:#1f2a14;font-size:28px;font-weight:800}.shutter{width:98px;justify-self:center;background:var(--orange);border:5px solid #ed4b38;box-shadow:0 8px 14px rgba(80,0,0,.30),inset 0 0 0 3px #151515}.flip{width:65px;justify-self:end;background:#ff4339;color:#52211f;font-size:31px}
.brand{font-family:Georgia,"Times New Roman",serif;font-weight:700;text-align:center;font-size:34px;line-height:.78;margin:16px 0 18px}.brand span{display:block;font-size:21px;margin-left:34px}
.tray{min-height:250px;background:var(--panel);border-radius:13px 13px 0 0;border:2px solid rgba(0,0,0,.4);padding:20px 14px 28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.polaroid{background:#fff;padding:7px 7px 16px;border-radius:3px;box-shadow:0 2px 5px rgba(0,0,0,.2);position:relative}.polaroid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#ddd}.polaroid button{position:absolute;right:4px;top:4px;border:0;background:rgba(0,0,0,.58);color:#fff;width:24px;height:24px;border-radius:50%;font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:#d8cbd2;padding:42px 12px;font-size:14px}#flashOverlay{pointer-events:none;position:fixed;inset:0;background:#fff;opacity:0;z-index:30;transition:opacity .16s}.notice{display:none;width:88%;margin:10px auto 0;background:rgba(50,0,0,.24);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.35;text-align:center}
.editor{position:fixed;inset:0;background:rgba(10,8,10,.96);z-index:25;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px)}.editor.open{display:flex}.editor-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.editor-title{font-weight:800;font-size:19px}.editor-btn{border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:15px}.retake{background:#29242a;color:#fff}.save{background:#ff453a;color:#fff}.preview-wrap{flex:1;display:grid;place-items:center;min-height:0}.preview-card{width:min(92vw,430px);aspect-ratio:1;background:#fff;padding:10px 10px 34px;box-shadow:0 12px 36px rgba(0,0,0,.45);border-radius:4px}.preview-card img{width:100%;height:100%;object-fit:cover;display:block}.filters-label{font-size:13px;color:#c9c2c7;margin:12px 3px 8px}.filter-strip{display:flex;gap:10px;overflow-x:auto;padding:0 2px 4px;scrollbar-width:none}.filter-strip::-webkit-scrollbar{display:none}.filter-chip{flex:0 0 78px;border:0;background:transparent;color:#fff;padding:0;text-align:center}.filter-thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;display:block;border:3px solid transparent}.filter-chip.active .filter-thumb{border-color:#ff453a}.filter-name{font-size:11px;margin-top:5px;white-space:nowrap}
@media(max-width:380px){.controls{gap:12px}.flash-btn,.flip{width:57px}.shutter{width:90px}.grid{gap:10px}.app{padding-left:12px;padding-right:12px}.filter-chip{flex-basis:70px}.filter-thumb{width:64px;height:64px}}
</style>
</head>
<body>
<div id="flashOverlay"></div>
<main class="app">
<section class="camera-shell"><div class="viewfinder"><video id="video" autoplay muted playsinline></video><div class="camera-hint" id="hint">Tap the orange button to allow camera access.</div></div></section>
<div class="controls"><button class="round flash-btn" id="flashBtn" aria-label="Flash effect">⚡</button><button class="round shutter" id="shutter" aria-label="Take photo"></button><button class="round flip" id="flipBtn" aria-label="Flip camera">↻</button></div>
<div class="notice" id="notice"></div><div class="brand">pico<span>cam</span></div>
<section class="tray"><div class="grid" id="photoGrid"><div class="empty">Your photos will appear here.</div></div></section>
</main>
<div class="editor" id="editor">
  <div class="editor-top"><button class="editor-btn retake" id="retakeBtn">Retake</button><div class="editor-title">Choose a filter</div><button class="editor-btn save" id="saveBtn">Save</button></div>
  <div class="preview-wrap"><div class="preview-card"><img id="editorPreview" alt="Photo preview"></div></div>
  <div class="filters-label">Filters</div><div class="filter-strip" id="filterStrip"></div>
</div>
<canvas id="canvas" hidden></canvas><canvas id="filterCanvas" hidden></canvas>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),filterCanvas=document.getElementById('filterCanvas'),shutter=document.getElementById('shutter'),flipBtn=document.getElementById('flipBtn'),flashBtn=document.getElementById('flashBtn'),flashOverlay=document.getElementById('flashOverlay'),hint=document.getElementById('hint'),notice=document.getElementById('notice'),photoGrid=document.getElementById('photoGrid'),editor=document.getElementById('editor'),editorPreview=document.getElementById('editorPreview'),filterStrip=document.getElementById('filterStrip'),retakeBtn=document.getElementById('retakeBtn'),saveBtn=document.getElementById('saveBtn');
let stream=null,facingMode='environment',flashEffect=true,db,pendingBlob=null,pendingUrl=null,selectedFilter='Original';
const FILTERS=[
{name:'Original',css:'none'},
{name:'Warm',css:'sepia(.18) saturate(1.18) contrast(1.05) brightness(1.04)'},
{name:'Cool',css:'saturate(.95) contrast(1.08) brightness(1.03) hue-rotate(8deg)'},
{name:'Fade',css:'contrast(.82) brightness(1.08) saturate(.78)'},
{name:'Film',css:'sepia(.22) contrast(1.14) saturate(.92) brightness(.96)'},
{name:'Sepia',css:'sepia(.72) contrast(1.02) saturate(.85)'},
{name:'B&W',css:'grayscale(1) contrast(1.18)'},
{name:'Retro',css:'sepia(.3) saturate(1.35) contrast(.92) brightness(1.05) hue-rotate(-8deg)'},
{name:'Dream',css:'brightness(1.12) contrast(.88) saturate(1.08)'},
{name:'Punch',css:'contrast(1.25) saturate(1.38) brightness(1.02)'}
];
function showNotice(m){notice.textContent=m;notice.style.display='block'}function clearNotice(){notice.style.display='none'}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('PicoCamDB',1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id',autoIncrement:true})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=()=>rej(r.error)})}
function addPhoto(blob){return new Promise((res,rej)=>{const r=db.transaction('photos','readwrite').objectStore('photos').add({blob,created:Date.now()});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function deletePhoto(id){return new Promise((res,rej)=>{const r=db.transaction('photos','readwrite').objectStore('photos').delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function getPhotos(){return new Promise((res,rej)=>{const r=db.transaction('photos','readonly').objectStore('photos').getAll();r.onsuccess=()=>res(r.result.sort((a,b)=>b.created-a.created));r.onerror=()=>rej(r.error)})}
async function renderPhotos(){const photos=await getPhotos();photoGrid.innerHTML='';if(!photos.length){photoGrid.innerHTML='<div class="empty">Your photos will appear here.</div>';return}photos.forEach(p=>{const card=document.createElement('div');card.className='polaroid';const img=document.createElement('img'),url=URL.createObjectURL(p.blob);img.src=url;img.onload=()=>URL.revokeObjectURL(url);img.onclick=()=>{const a=document.createElement('a'),dl=URL.createObjectURL(p.blob);a.href=dl;a.download=`pico-${new Date(p.created).toISOString().replace(/[:.]/g,'-')}.jpg`;a.click();setTimeout(()=>URL.revokeObjectURL(dl),1500)};const del=document.createElement('button');del.textContent='×';del.onclick=async e=>{e.stopPropagation();await deletePhoto(p.id);renderPhotos()};card.append(img,del);photoGrid.appendChild(card)})}
async function startCamera(){clearNotice();if(!navigator.mediaDevices?.getUserMedia){showNotice('Camera access is not available here. Open this page in Safari over HTTPS.');return}if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facingMode},width:{ideal:1920},height:{ideal:1920}},audio:false});video.srcObject=stream;await video.play();hint.style.display='none';video.classList.toggle('mirror',facingMode==='user')}catch(e){console.error(e);showNotice('Camera permission was blocked. Allow Camera access for this website in Safari settings, then reload.')}}
function buildFilters(){filterStrip.innerHTML='';FILTERS.forEach(f=>{const b=document.createElement('button');b.className='filter-chip'+(f.name==='Original'?' active':'');b.dataset.name=f.name;b.innerHTML=`<img class="filter-thumb" alt="${f.name}"><div class="filter-name">${f.name}</div>`;b.onclick=()=>selectFilter(f.name);filterStrip.appendChild(b)})}
function refreshThumbs(){document.querySelectorAll('.filter-chip').forEach(btn=>{const f=FILTERS.find(x=>x.name===btn.dataset.name);const img=btn.querySelector('img');img.src=pendingUrl;img.style.filter=f.css})}
function selectFilter(name){selectedFilter=name;const f=FILTERS.find(x=>x.name===name);editorPreview.style.filter=f.css;document.querySelectorAll('.filter-chip').forEach(b=>b.classList.toggle('active',b.dataset.name===name))}
function openEditor(blob){pendingBlob=blob;if(pendingUrl)URL.revokeObjectURL(pendingUrl);pendingUrl=URL.createObjectURL(blob);editorPreview.src=pendingUrl;selectedFilter='Original';editorPreview.style.filter='none';editor.classList.add('open');document.body.style.overflow='hidden';refreshThumbs();selectFilter('Original')}
function closeEditor(){editor.classList.remove('open');document.body.style.overflow='';if(pendingUrl){URL.revokeObjectURL(pendingUrl);pendingUrl=null}pendingBlob=null}
function applyFilterToBlob(blob,filterCss){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{filterCanvas.width=img.naturalWidth;filterCanvas.height=img.naturalHeight;const ctx=filterCanvas.getContext('2d');ctx.filter=filterCss;ctx.drawImage(img,0,0);filterCanvas.toBlob(b=>b?resolve(b):reject(new Error('Filter failed')),'image/jpeg',.92)};img.onerror=reject;img.src=URL.createObjectURL(blob)})}
async function takePhoto(){if(!stream){await startCamera();if(!stream)return}if(video.readyState<2)return;if(flashEffect){flashOverlay.style.opacity='.92';setTimeout(()=>flashOverlay.style.opacity='0',90)}const vw=video.videoWidth,vh=video.videoHeight,size=Math.min(vw,vh),sx=(vw-size)/2,sy=(vh-size)/2;canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');ctx.save();if(facingMode==='user'){ctx.translate(size,0);ctx.scale(-1,1)}ctx.drawImage(video,sx,sy,size,size,0,0,size,size);ctx.restore();canvas.toBlob(blob=>{if(blob)openEditor(blob)},'image/jpeg',.92)}
retakeBtn.onclick=closeEditor;saveBtn.onclick=async()=>{if(!pendingBlob)return;saveBtn.disabled=true;saveBtn.textContent='Saving…';try{const f=FILTERS.find(x=>x.name===selectedFilter);const finalBlob=f.css==='none'?pendingBlob:await applyFilterToBlob(pendingBlob,f.css);await addPhoto(finalBlob);await renderPhotos();closeEditor()}finally{saveBtn.disabled=false;saveBtn.textContent='Save'}};
shutter.onclick=takePhoto;flipBtn.onclick=async()=>{facingMode=facingMode==='environment'?'user':'environment';await startCamera()};flashBtn.onclick=()=>{flashEffect=!flashEffect;flashBtn.style.opacity=flashEffect?'1':'.45'};
buildFilters();(async()=>{try{await openDB();await renderPhotos()}catch(e){showNotice('Could not open local photo storage in this browser.')}startCamera()})();
</script>
</body></html>
