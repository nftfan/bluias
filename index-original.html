    body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(150deg,#24152070,#181722b0 75%)}
    a,button{-webkit-tap-highlight-color:transparent;font:inherit}button{color:inherit}svg{display:block}a:focus-visible,button:focus-visible{outline:3px solid #d8efff;outline-offset:4px}[hidden]{display:none!important}
    .link-page{width:min(100%,418px);margin:0 auto;padding:22px;border:1px solid #ffffff32;border-radius:30px;background:linear-gradient(145deg,#ffffff19,#ffffff09);box-shadow:0 24px 80px #0907104d,inset 0 1px 0 #ffffff1a;-webkit-backdrop-filter:blur(25px);backdrop-filter:blur(25px);animation:arrive .65s ease both}
    .profile-header{padding:2px 2px 19px}
    .brand{margin:0 0 7px;color:#e6c8d1;font-size:10px;line-height:1.5;font-weight:750;letter-spacing:3px;text-transform:uppercase}
    h1{margin:0;font-size:32px;line-height:1.1;font-weight:650;letter-spacing:-1.2px}
    .link-group{display:grid;gap:11px}
    .social-link{display:grid;grid-template-columns:36px minmax(0,1fr) 18px;align-items:center;gap:12px;min-height:62px;padding:10px 16px 10px 12px;border:1px solid #ffffff55;border-radius:18px;color:#3e2d3b;background:linear-gradient(115deg,#fff7f5f5,#f2e1e9ec);text-decoration:none;box-shadow:0 4px 14px #15101b16;transition:transform .22s ease,box-shadow .22s ease,filter .22s ease}
    .social-link:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 8px 22px #15101b30}
    .social-link:active{transform:scale(.99)}
    .social-link strong{font-size:14px;font-weight:700;letter-spacing:-.15px}
    .platform-symbol{display:grid;place-items:center;width:36px;height:36px;border:1px solid #7e5b7319;border-radius:12px;background:#ffffff5c}
    .platform-symbol svg{width:21px;height:21px;fill:currentColor}
    .icon-stroke{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .link-arrow{width:18px;height:18px;opacity:.75;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .link-telegram{border-color:#9bdaff6b;color:#fff;background:linear-gradient(115deg,#369fd7e8,#248bc7df)}
    .link-telegram .platform-symbol{background:#ffffff1c;border-color:#ffffff25}
    .video-window{position:relative;isolation:isolate;overflow:hidden;margin:18px 0 0;border:1px solid #ffffff22;border-radius:20px;aspect-ratio:540/994;background:#58464e url('/assets/home/links-preview.webp') center/cover no-repeat;box-shadow:0 8px 24px #10091625}
    .video-window video{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease}
    .video-window.is-ready video{opacity:1}
    .video-tools{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
    .media-label{padding:8px 11px;border:1px solid #ffffff2b;border-radius:999px;background:#21172540;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:8px;font-weight:750;letter-spacing:2px;color:#fff;line-height:1}
    .control-group{display:flex;gap:7px;pointer-events:auto}
    .video-button{display:grid;place-items:center;width:36px;height:36px;padding:0;border:1px solid #ffffff45;border-radius:50%;background:#21172557;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);cursor:pointer;transition:background .2s ease}
    .video-button:hover{background:#21172591}
    .video-button svg{width:17px;height:17px;fill:currentColor}
    @keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(min-width:700px){body{padding-top:36px;padding-bottom:36px}.link-page{width:386px;padding:21px}.video-window{max-height:570px}}
    @media(max-width:380px){body{padding:16px 12px calc(18px + env(safe-area-inset-bottom,0px))}.link-page{padding:18px;border-radius:25px}.profile-header{padding-bottom:17px}h1{font-size:29px}.social-link{min-height:59px;gap:10px;padding-right:13px;border-radius:16px}.social-link strong{font-size:13px}.video-window{margin-top:16px;border-radius:17px}}
    @media(prefers-reduced-motion:reduce){.link-page{animation:none}.social-link,.video-window video,.video-button{transition:none}.social-link:hover,.social-link:active{transform:none}}
  </style>
</head>
<body>
  <main class="link-page" aria-labelledby="links-title">
    <header class="profile-header">
      <p class="brand">Bluias</p>
      <h1 id="links-title">Links</h1>
    </header>
    <div class="link-group" role="navigation" aria-label="Official Bluias links">
      <a class="social-link link-onlyfans" href="/onlyfans/"><span class="platform-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="3" y="5" width="18" height="15" rx="4"/><path class="icon-stroke" d="m8 5 1.5-2h5L16 5"/><circle class="icon-stroke" cx="12" cy="12.5" r="3.5"/></svg></span><strong>Bluias OnlyFans</strong><svg class="link-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
      <a class="social-link link-telegram" href="https://t.me/vbluia" target="_blank" rel="noopener noreferrer"><span class="platform-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m20.7 3.4-18 7c-.9.4-.9.9-.2 1.1l4.6 1.5 1.8 5.5c.2.6.4.8.8.8s.6-.2.9-.5l2.5-2.4 5 3.7c.9.5 1.5.2 1.7-.8l3-14.1c.3-1.2-.5-1.7-1.3-1.3L9.6 13.7l-.5 4.1-1.2-5L20.7 3.4Z"/></svg></span><strong>Telegram</strong><svg class="link-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
    </div>
    <figure class="video-window" id="video-window" aria-label="Bluias video preview">
      <video id="links-video" width="540" height="994" poster="/assets/home/links-preview.webp" muted loop playsinline preload="metadata" controls aria-label="Bluias video preview"><source src="/assets/home/links-preview.mp4" type="video/mp4"></video>
      <div class="video-tools" id="video-tools" hidden>
        <span class="media-label" aria-hidden="true">BLUIAS</span>
        <div class="control-group">
          <button class="video-button" id="video-play" type="button" aria-label="Play video"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"/></svg><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
          <button class="video-button" id="video-sound" type="button" aria-label="Unmute video"><svg class="muted-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3Z"/><path class="icon-stroke" d="m16 9 5 6m0-6-5 6"/></svg><svg class="sound-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M3 9v6h4l5 4V5L7 9H3Z"/><path class="icon-stroke" d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>
        </div>

  <!-- Compatibility hooks for the existing homepage loader. -->
  <div hidden aria-hidden="true"><button id="telegram-wallet-copy" type="button" tabindex="-1"><span>Copy</span></button><span id="telegram-wallet-status"></span></div>
  <script>
  (()=>{
    'use strict';
    const video=document.getElementById('links-video');
    const frame=document.getElementById('video-window');
    const play=document.getElementById('video-play');
    const sound=document.getElementById('video-sound');
    const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
    let manuallyPaused=false;
    let visible=true;
    video.muted=true;
    video.controls=false;
    document.getElementById('video-tools').hidden=false;
    const updatePlay=()=>{
      play.querySelector('.play-icon').toggleAttribute('hidden',!video.paused);
      play.querySelector('.pause-icon').toggleAttribute('hidden',video.paused);
      play.setAttribute('aria-label',video.paused?'Play video':'Pause video');
    };
    const updateSound=()=>{
      sound.querySelector('.muted-icon').toggleAttribute('hidden',!video.muted);
      sound.querySelector('.sound-icon').toggleAttribute('hidden',video.muted);
      sound.setAttribute('aria-label',video.muted?'Unmute video':'Mute video');
    };
    const start=()=>{if(!manuallyPaused&&!document.hidden&&visible&&!reducedMotion.matches)video.play().catch(()=>{});};
    video.addEventListener('loadeddata',()=>frame.classList.add('is-ready'));
    video.addEventListener('playing',()=>frame.classList.add('is-ready'));
    video.addEventListener('play',updatePlay);
    video.addEventListener('pause',updatePlay);
    video.addEventListener('volumechange',updateSound);
    video.addEventListener('canplay',start,{once:true});
    video.addEventListener('error',()=>{document.getElementById('video-tools').hidden=true;},{once:true});
    play.addEventListener('click',()=>{
      manuallyPaused=!video.paused;
      if(video.paused)video.play().catch(()=>{});else video.pause();
    });
    sound.addEventListener('click',()=>{video.muted=!video.muted;});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)video.pause();else start();});
    if('IntersectionObserver' in window){new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;if(visible)start();else video.pause();},{threshold:.15}).observe(video);}
    if(reducedMotion.addEventListener)reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches)video.pause();else start();});
    if(!reducedMotion.matches){video.autoplay=true;video.preload='auto';start();}
    if(video.readyState>=2)frame.classList.add('is-ready');
    updatePlay();updateSound();
  })();
  </script>
</body>
