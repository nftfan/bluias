<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#302936">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Kiara's Bluia Board Pro. Photos and moments from Bluia B001.">
  <title>Kiara · Bluia Board Pro · B001</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #302936;
      --surface: #111013;
      --text: #f8f1f4;
      --muted: #b7a7b0;
      --rose: #e7b2c9;
      --gold: #e4cc82;
      --media-accent: #e7b2c9;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--background); }
    body {
      margin: 0;
      min-height: 100svh;
      background: radial-gradient(ellipse at 50% 0, #6743542b, transparent 55%), var(--background);
      color: var(--text);
    }
    h1, h2, p, figure { margin: 0; }
    img { display: block; max-width: 100%; }
    .masthead {
      position: relative;
      z-index: 10;
      padding: 18px 20px 17px;
      border-bottom: 1px solid #ffffff0d;
      background: #17121aed;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
    }
    .masthead::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 2px;
      background: linear-gradient(90deg, #8f596b, #e7b2c9 35%, #f5e5bf 65%, #8f596b);
    }
    .masthead h1 {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 650;
      letter-spacing: -.35px;
    }
    .pro {
      padding: 4px 8px;
      border: 1px solid #e4cc8245;
      border-radius: 7px;
      background: linear-gradient(135deg, #342b19, #1d1911);
      color: #f1dfa7;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .25px;
    }
    main { width: 100%; margin: 0 auto; padding: 26px 0 0; }
    .profile { width: 100%; margin: 0 auto; }
    .profile-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }
    .agent-code { color: var(--rose); font-variant-numeric: tabular-nums; }
    .portrait {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      aspect-ratio: 3 / 4;
      border: 1px solid #e7b2c933;
      border-radius: 22px 22px 0 0;
      background: var(--surface);
      box-shadow: 0 18px 60px #00000040;
    }
    .portrait .smooth-media-frame { height: 100%; aspect-ratio: 3 / 4 !important; }
    .portrait .feed-media { width: 100%; height: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
    .portrait figcaption {
      position: absolute;
      inset: auto 0 0;
      z-index: 3;
      padding: 72px 24px 24px;
      background: linear-gradient(transparent, #080708d9);
      pointer-events: none;
    }
    .portrait h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 9vw, 48px);
      line-height: 1.05;
      font-weight: 400;
      letter-spacing: -1.5px;
      text-shadow: 0 2px 20px #00000040;
    }
    .portrait p { margin-top: 8px; color: #e7d7df; font-size: 11px; letter-spacing: .45px; }
    .collection { padding-top: 38px; }
    .collection-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 17px;
    }
    .collection h2 { font-size: 15px; font-weight: 550; letter-spacing: -.2px; }
    .collection-heading p { color: var(--muted); font-size: 10px; }
    .photo-post {
      position: relative;
      overflow: hidden;
      margin-bottom: 22px;
      border: 1px solid #e7b2c933;
      border-radius: 16px 16px 0 0;
      background: var(--surface);
      box-shadow: 0 12px 32px #00000040;
    }
    .portrait::after, .photo-post::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      z-index: 4;
      height: 3px;
      background: linear-gradient(90deg, #80546b, #ddb5c7 42%, #c6b282 65%, #80546b);
      box-shadow: 0 -1px 0 #ffffff14;
      pointer-events: none;
    }
    .photo-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 27px;
      padding: 0 12px;
      border-bottom: 1px solid #e7b2c91a;
      background: linear-gradient(90deg, #21151d, #181116);
      color: #e7bfce;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .6px;
    }
    .photo-strip span:last-child { color: #b29aa6; font-size: 8px; font-variant-numeric: tabular-nums; }
    .feed-media { display: block; width: 100%; height: auto; background: var(--surface); }
    .feed-media:not([src]) { visibility: hidden; }
    .board-video { display: block; width: 100%; height: auto; aspect-ratio: 540 / 948; object-fit: cover; }
    .video-post .smooth-media-frame { aspect-ratio: 540 / 948 !important; }
    footer { padding: 14px 20px 32px; color: #84737d; text-align: center; font-size: 10px; letter-spacing: .5px; }
    @media (min-width: 700px) {
      main { padding-top: 34px; }
      .collection { padding-top: 44px; }
      .photo-post { margin-bottom: 28px; border-radius: 20px 20px 0 0; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .profile-meta, .portrait, .collection-heading { animation: arrive .65s ease both; }
      .portrait { animation-delay: .06s; }
      .collection-heading { animation-delay: .12s; }
      @keyframes arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    }

    [hidden] { display: none !important; }
    button { font: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, .panel:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .masthead h1 { flex-wrap: wrap; }
    .model-title { color: #efc6d8; font-weight: 750; }
    .album-nav { border-bottom: 1px solid #e7b2c92b; background: linear-gradient(110deg, #242332, #312333 65%, #241e2c); }
    .album-tabs { display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain; padding: 13px 14px 15px; scroll-snap-type: x proximity; scrollbar-width: none; }
    .album-tabs::-webkit-scrollbar { display: none; }
    .album-tab { flex: 1 0 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 96px; min-height: 53px; padding: 10px 12px; border: 1px solid #ffffff19; border-radius: 12px; background: #201925; color: #e0cfda; cursor: pointer; scroll-snap-align: center; transition: background .2s ease, border-color .2s ease, color .2s ease; }
    .album-tab strong { font-size: 12px; line-height: 1.1; font-weight: 750; white-space: nowrap; }
    .album-tab small { color: #ab95a5; font-size: 9px; line-height: 1; letter-spacing: .15px; }
    .album-tab:hover { border-color: #d8adc45e; }
    .album-tab.is-active { border-color: #f1cedb; background: linear-gradient(135deg, #edc6d7, #d9c59b); color: #281a22; box-shadow: 0 5px 18px #00000024; }
    .album-tab.is-active small { color: #624856; }
    .album-tab.is-spicy { border-color: #e575746b; background: linear-gradient(135deg, #642534, #3e1a29); color: #ffd4cc; }
    .album-tab.is-spicy small { color: #e3aaa7; }
    .album-tab.is-spicy.is-active { border-color: #ffb3a6; background: linear-gradient(135deg, #c34b57, #8c263c); color: #fff5ef; }
    .album-tab.is-spicy.is-active small { color: #ffe1d8; }
    #panel-spicy { --media-accent: #f4a18f; }
    .spicy-post { border-color: #e5757440; }
    .spicy-post .photo-strip { border-bottom-color: #e5757426; background: linear-gradient(90deg, #512530, #2c1722); color: #ffd7c9; }
    .panel { width: 100%; }
    .media-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 14px 17px; }
    .media-heading h2 { font-size: 15px; font-weight: 600; }
    .media-heading p { color: var(--muted); font-size: 10px; }
    .album-empty { display: grid; justify-items: center; align-content: center; gap: 12px; min-height: 340px; margin: 0 14px 22px; padding: 32px 22px; border: 1px solid #e7b2c926; border-radius: 18px 18px 0 0; background: radial-gradient(ellipse at 50% 0, #78526d1c, transparent 65%), #18121c; text-align: center; box-shadow: 0 14px 32px #00000020; }
    .album-empty .album-mark { display: grid; place-items: center; min-width: 56px; height: 56px; padding: 0 12px; border: 1px solid #e7b2c92e; border-radius: 16px; background: #302332; color: #eac2d5; font-size: 20px; font-weight: 700; }
    .album-empty h2 { color: #f1dce7; font-size: 19px; font-weight: 600; letter-spacing: -.3px; }
    .album-empty p { color: var(--muted); font-size: 12px; line-height: 1.7; }
    @media (prefers-reduced-motion: reduce) { .album-tab { transition: none; } }
  </style>
  <noscript><style>.feed-media[data-src] { display: none; }</style></noscript>
</head>

  <script>
    (() => {
      "use strict";
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      const panels = tabs.map(tab => document.getElementById(tab.getAttribute("aria-controls")));
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let selected = 0;
      function setCount(element, count, kind) {
        if (!element) return;
        const label = `${count} ${kind}${count === 1 ? "" : "s"}`;
        if (element.textContent !== label) element.textContent = label;
      }
      function refreshCounts() {
        tabs.forEach((tab, index) => {
          const label = tab.querySelector("[data-item-count]");
          const kind = label.dataset.countKind;
          const selector = kind === "photo" ? "img.feed-media" : kind === "video" ? "video.feed-media" : "img.feed-media, video.feed-media";
          const count = panels[index].querySelectorAll(selector).length;
          setCount(label, count, kind);
          setCount(panels[index].querySelector("[data-panel-count]"), count, kind);
        });
        setCount(document.querySelector("[data-collection-count]"), panels[0].querySelectorAll(".collection img.feed-media").length, "photo");
      }
      function selectAlbum(index, options = {}) {
        selected = index;
        refreshCounts();
        tabs.forEach((tab, position) => {
          const active = position === index;
          tab.classList.toggle("is-active", active);
          tab.setAttribute("aria-selected", String(active));
          tab.tabIndex = active ? 0 : -1;
          panels[position].hidden = !active;
          panels[position].classList.toggle("active", active);
          if (!active) panels[position].querySelectorAll("video").forEach(video => video.pause());
        });
        if (options.updateHash) history.replaceState(null, "", "#" + tabs[index].dataset.album);
        if (options.focus) tabs[index].focus({ preventScroll: true });
        if (options.scrollTab) tabs[index].scrollIntoView({ block: "nearest", inline: "center", behavior: reducedMotion.matches ? "auto" : "smooth" });
        if (options.animate && !reducedMotion.matches && panels[index].animate) {
          panels[index].animate([{ opacity: .25, transform: "translateY(8px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 320, easing: "cubic-bezier(.22,.61,.36,1)" });
        }
      }
      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => selectAlbum(index, { updateHash: true, scrollTab: true, animate: true }));
        tab.addEventListener("keydown", event => {
          let next;
          if (event.key === "ArrowRight") next = (selected + 1) % tabs.length;
          else if (event.key === "ArrowLeft") next = (selected - 1 + tabs.length) % tabs.length;
          else if (event.key === "Home") next = 0;
          else if (event.key === "End") next = tabs.length - 1;
          else return;
          event.preventDefault();
          selectAlbum(next, { updateHash: true, focus: true, scrollTab: true, animate: true });
        });
      });
      function fromHash() {
        const key = location.hash.slice(1).toLowerCase();
        const index = tabs.findIndex(tab => tab.dataset.album === key);
        selectAlbum(index >= 0 ? index : 0);
      }
      fromHash();
      window.addEventListener("hashchange", fromHash);
    })();
  </script>
