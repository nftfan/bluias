<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080708">
  <meta name="robots" content="noindex, nofollow, noarchive">

  <meta name="description" content="Kaira's Bluia Board Pro. Photos and moments from Bluia B001.">
  <title>Bluia Board Pro — Kaira · B001</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #080708;
      --surface: #111013;
      --text: #f8f1f4;
      --muted: #b7a7b0;
      --rose: #e7b2c9;
      --gold: #e4cc82;
      --media-accent: #e7b2c9;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--background); }
    body { margin: 0; min-height: 100svh; background: var(--background); color: var(--text); }
    h1, h2, p, figure { margin: 0; }
    img { display: block; max-width: 100%; }
    .masthead {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 18px 20px 17px;
      border-bottom: 1px solid #ffffff0d;
      background: #080708ed;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
    }
    .masthead::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 2px;
      background: linear-gradient(90deg, #8f596b, #e7b2c9 35%, #f5e5bf 65%, #8f596b);
    }
    .masthead h1 {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 650;
      letter-spacing: -.35px;
    }
    .pro {
      padding: 4px 8px;
      border: 1px solid #e4cc8245;
      border-radius: 7px;
      background: linear-gradient(135deg, #342b19, #1d1911);
      color: #f1dfa7;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .25px;
    }
    main { width: 100%; margin: 0 auto; padding: 26px 0 0; }
    .profile { width: 100%; margin: 0 auto; }
    .profile-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }
    .agent-code { color: var(--rose); font-variant-numeric: tabular-nums; }
    .portrait {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      aspect-ratio: 3 / 4;
      border: 1px solid #ffffff14;
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 18px 60px #00000040;
    }
    .portrait .smooth-media-frame { height: 100%; aspect-ratio: 3 / 4 !important; }
    .portrait .feed-media { width: 100%; height: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
    .portrait figcaption {
      position: absolute;
      inset: auto 0 0;
      z-index: 3;
      padding: 72px 24px 24px;
      background: linear-gradient(transparent, #080708d9);
      pointer-events: none;
    }
    .portrait h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 9vw, 48px);
      line-height: 1.05;
      font-weight: 400;
      letter-spacing: -1.5px;
      text-shadow: 0 2px 20px #00000040;
    }
    .portrait p { margin-top: 8px; color: #e7d7df; font-size: 11px; letter-spacing: .45px; }
    .collection { padding-top: 38px; }
    .collection-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 17px;
    }
    .collection h2 { font-size: 15px; font-weight: 550; letter-spacing: -.2px; }
    .collection-heading p { color: var(--muted); font-size: 10px; }
    .photo-post {
      overflow: hidden;
      margin-bottom: 22px;
      border: 1px solid #ffffff12;
      border-radius: 16px;
      background: var(--surface);
    }
    .photo-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 27px;
      padding: 0 12px;
      border-bottom: 1px solid #e7b2c91a;
      background: linear-gradient(90deg, #21151d, #181116);
      color: #e7bfce;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .6px;
    }
    .photo-strip span:last-child { color: #b29aa6; font-size: 8px; font-variant-numeric: tabular-nums; }
    .feed-media { display: block; width: 100%; height: auto; background: var(--surface); }
    .feed-media:not([src]) { visibility: hidden; }
    footer { padding: 14px 20px 32px; color: #84737d; text-align: center; font-size: 10px; letter-spacing: .5px; }
    @media (min-width: 700px) {
      main { padding-top: 34px; }
      .collection { padding-top: 44px; }
      .photo-post { margin-bottom: 28px; border-radius: 20px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .profile-meta, .portrait, .collection-heading { animation: arrive .65s ease both; }
      .portrait { animation-delay: .06s; }
      .collection-heading { animation-delay: .12s; }
      @keyframes arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
  <noscript><style>.feed-media[data-src] { display: none; }</style></noscript>
</head>
