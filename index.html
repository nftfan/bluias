      document.querySelectorAll('.mag-photo-frame').forEach(frame=>{
        const image=frame.querySelector('img');
        const reveal=()=>{
          const finish=()=>requestAnimationFrame(()=>{
            frame.classList.add('is-ready');
            frame.setAttribute('aria-busy','false');
          });
          if(image.decode)image.decode().catch(()=>{}).then(finish);
          else finish();
        };
        const failed=()=>{
          if(!image.dataset.originalTried){
            image.dataset.originalTried='1';
            image.removeAttribute('srcset');
            image.removeAttribute('sizes');
            image.src=image.dataset.originalSrc;
            return;
          }
          frame.classList.add('is-error');
          frame.setAttribute('aria-busy','false');
          frame.querySelector('.mag-photo-status').textContent='Photo could not load. Please refresh to try again.';
        };
        image.addEventListener('load',reveal);
        image.addEventListener('error',failed);
        if(image.complete){if(image.naturalWidth)reveal();else failed()}
      });
      document.getElementById('moms-membership-float')?.addEventListener('click',()=>{
        document.querySelector('.nav-btn[data-panel="members"]')?.click();
        document.getElementById('moms-membership-card')?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});
      });
      const copyButton=document.getElementById('telegram-wallet-copy');
      const copyStatus=document.getElementById('telegram-wallet-status');
      copyButton.addEventListener('click',async()=>{
        let copied=false;
        try{
          await navigator.clipboard.writeText(wallet);
          copied=true;
        }catch(error){
          const field=document.createElement('textarea');
          field.value=wallet;
          field.setAttribute('readonly','');
          field.style.cssText='position:fixed;top:0;left:-9999px';
          document.body.appendChild(field);
          field.select();
          field.setSelectionRange(0,wallet.length);
          try{copied=document.execCommand('copy');}catch(error){}
          field.remove();
          copyButton.focus();
        }
        copyButton.querySelector('span').textContent=copied?'Copied!':'Copy wallet address';
        copyStatus.textContent=copied?'Wallet address copied. Thank you for your support!':'Could not copy. Select and copy the wallet address above.';
      });
    }catch(error){
      document.body.innerHTML='<div style="padding:30px;text-align:center;color:#fff;font:12px Inter,Arial,sans-serif">Bluias could not load. Please refresh the page.</div>';
    }
  })();
  </script>
