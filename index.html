<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f9ff">
<meta name="description" content="Meet the Bluias Sisters. Join our Telegram or subscribe to the Bluias Pro feed for unlimited stories and news.">
<meta property="og:title" content="Bluias Sisters — Stories, style & more">
<meta property="og:description" content="A little window into the Bluias Sisters' world.">
<meta property="og:image" content="https://huggingface.co/buckets/Bluia/bimg/resolve/4ACE6C13-B935-4145-B851-240C424E24B8.png?download=true">
<title>Bluias Sisters — Stories, style & more</title>
<style>
:root{color-scheme:light;--ink:#10284b;--muted:#647995;--blue:#2476e8;--line:#dce9f8;--pale:#f5f9ff;--sky:#e9f3ff;--white:#fff;--shadow:0 16px 42px #2b5d9617}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--pale);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
a{color:inherit}
.wrap{width:min(1120px,calc(100% - 40px));margin-inline:auto}
.site-head{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-size:17px;letter-spacing:.16em;font-weight:900;color:#133d73}
.head-note{color:var(--muted);font-size:12px;font-weight:650}
.hero{padding:0 0 52px}
.cover{position:relative;overflow:hidden;width:100vw;margin-left:calc(50% - 50vw);border-radius:0;background:#dceaf8;aspect-ratio:auto;min-height:0;box-shadow:none}
.cover img{display:block;width:100%;height:auto;max-height:none;position:relative;inset:auto;object-fit:contain;object-position:center}


.kicker{font-size:10px;font-weight:850;letter-spacing:.22em;text-transform:uppercase;color:#c8e4ff}


.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:11px;padding:14px 0 18px}
.action{display:inline-flex;min-height:48px;align-items:center;justify-content:center;gap:10px;padding:0 19px;border-radius:13px;text-decoration:none;font-size:12px;font-weight:800;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.action:hover{transform:translateY(-2px)}
.action:focus-visible{outline:3px solid #75b8ff;outline-offset:3px}
.action-telegram{background:#e4f2ff;border:1px solid #b9d9fa;color:#15599e}
.action-pro{background:linear-gradient(135deg,#277ce9,#1459bb);border:1px solid #1d6bd1;color:#fff;box-shadow:0 8px 22px #2377e637}
.action-pro small{font-size:10px;font-weight:650;opacity:.84}
.arrow{font-size:16px}
.feed-section{padding:0 0 72px;background:linear-gradient(180deg,#f0f7ff 0%,#f8fbff 260px)}
.feed-tabs{display:flex;justify-content:center;gap:8px;margin:0 auto 19px}
.feed-tab{min-width:112px;padding:11px 22px;border:1px solid #c9dcf1;border-radius:999px;background:#fff;color:#52708f;font:750 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;cursor:pointer;transition:background .18s ease,color .18s ease,box-shadow .18s ease}
.feed-tab.is-active{border-color:#1e70d7;background:#2476e8;color:#fff;box-shadow:0 7px 18px #2476e833}
.feed-tab:focus-visible{outline:3px solid #75b8ff;outline-offset:3px}
.feed-grid{display:grid;grid-template-columns:minmax(0,1fr);max-width:560px;margin:0 auto;gap:20px}
.story{min-width:0;background:#fff;border:1px solid #e4edf8;border-radius:18px;overflow:hidden;box-shadow:0 7px 22px #25578c0b;transition:transform .2s ease,box-shadow .2s ease}
.story:hover{transform:translateY(-3px);box-shadow:0 14px 32px #25578c17}
.story-visual{position:relative;aspect-ratio:9/16;overflow:hidden;background:#dbe9f8}
.story-media{display:block;width:100%;height:100%;object-fit:cover;object-position:center top;filter:blur(0);transform:none;transition:filter .38s ease}
.story-shade{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#071d3410 30%,#0c2d554f);opacity:0;pointer-events:none;transition:opacity .25s ease}
body.pro-active .story-media{filter:blur(14px)}
body.pro-active .story-shade{opacity:1}
.lock-mark{display:grid;place-items:center;width:43px;height:43px;border:1px solid #ffffff85;border-radius:50%;background:#f8fbffdd;color:#19518a;font-size:17px;box-shadow:0 5px 20px #123c682b}
.type-pill{position:absolute;left:11px;top:11px;border-radius:999px;padding:6px 9px;background:#f5faffeb;color:#245e9a;font-size:9px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 3px 12px #092a4b18}
.story-copy{padding:13px 14px 15px}
.story-copy h3{margin:0;color:#173b66;font-size:13px;line-height:1.35;font-weight:800}
.post-caption{display:grid;gap:3px;margin:7px 0 0;color:#7086a0;font-size:10px;line-height:1.5;font-weight:550}.post-caption span{display:block}
.site-foot{padding:22px 0 30px;border-top:1px solid var(--line);background:#fff;color:#7890aa;font-size:10px;text-align:center;letter-spacing:.04em}
@media(max-width:850px){.feed-grid{gap:15px}}
@media(max-width:560px){.wrap{width:min(100% - 28px,1120px)}.hero{padding:0 0 15px}.cover{aspect-ratio:auto;min-height:0;border-radius:0}.cover img{object-position:center}.actions{gap:8px;padding:10px 0 12px}.action{padding:0 11px;min-height:46px;font-size:11px}.action-pro{gap:6px}.action-pro small{font-size:9px}.feed-section{padding:0 0 52px}.feed-tabs{margin-bottom:14px}.feed-tab{min-width:100px}.feed-grid{gap:11px}.story{border-radius:14px}.story-copy{padding:11px 10px 12px}.story-copy h3{font-size:11px}.post-caption{font-size:9px}.type-pill{left:8px;top:8px;font-size:8px;padding:5px 7px}.lock-mark{width:36px;height:36px;font-size:15px}.floating-pro{right:14px;bottom:16px;width:58px;height:58px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.action,.story,.story-media{transition:none!important}.story:hover,.action:hover{transform:none}}
</style>
</head>
<body>
<main>
  <section class="hero wrap" aria-label="Bluias Sisters introduction">
    <div class="cover">
      <img src="https://huggingface.co/buckets/Bluia/bimg/resolve/4ACE6C13-B935-4145-B851-240C424E24B8.png?download=true" alt="Bluias Sisters cover portrait" fetchpriority="high" decoding="async">
      
    </div>
    <div class="actions" aria-label="Join the Bluias Sisters">
      <a class="action action-telegram" href="https://t.me/vbluia" target="_blank" rel="noopener noreferrer">Join our Telegram <span class="arrow" aria-hidden="true">↗</span></a>
      <a class="action action-pro" href="https://buy.stripe.com/8x23cnbA49TM1yFgrRbAs06">Subscribe <small>$10 / month</small> <span class="arrow" aria-hidden="true">↗</span></a>
    </div>
  </section>
  <section class="feed-section" aria-labelledby="feed-title">
    <div class="wrap">
      <div class="feed-tabs" role="tablist" aria-label="Choose free or pro posts">
        <button class="feed-tab is-active" id="free-tab" type="button" role="tab" aria-selected="true" data-view="free">Free</button>
        <button class="feed-tab" id="pro-tab" type="button" role="tab" aria-selected="false" data-view="pro">Pro</button>
      </div>
      <div class="feed-grid" id="feed-grid" role="tabpanel" aria-labelledby="free-tab"></div>
    </div>
  </section>
</main>
<a class="floating-pro" href="https://buy.stripe.com/8x23cnbA49TM1yFgrRbAs06" aria-label="Unlock Pro for $10 per month" title="Unlock Pro for $10 per month"><span>PRO</span><b aria-hidden="true">↗</b></a>
<footer class="site-foot">BLUIAS · A brighter little corner of the internet</footer>
<script>
(function(){
  const items=[
    {type:"photo",title:"Morning Light",src:"/test/media/cover-b6.webp"},
    {type:"photo",title:"Blue Hour Portrait",src:"/test/media/cover-b7.webp"},
    {type:"photo",title:"A Softer Sunday",src:"/test/media/cover-b8.webp"},
    {type:"video",title:"Sisterhood in Motion",src:"/b001-aszx/media/friends-dd573039.mp4",poster:"/b001-aszx/media/friends-b730ee5b.webp"},
    {type:"photo",title:"The Little Things",src:"/test/media/cover-b9.webp"},
    {type:"photo",title:"A New Favorite",src:"/test/media/cover-b10.webp"},
    {type:"video",title:"Behind the Blue",src:"/b001-aszx/media/video-b328e34f.mp4",poster:"/b001-aszx/media/images-2b588214.webp"},
    {type:"photo",title:"Weekend Notes",src:"/test/media/cover-b11.webp"},
    {type:"photo",title:"Soft Focus",src:"/test/media/cover-b12.webp"},
    {type:"photo",title:"In Our Own Time",src:"/test/media/cover-b13.webp"},
    {type:"video",title:"A Little Daydream",src:"/b001-aszx/video-1-preview.mp4",poster:"/b001-aszx/media/a3-4e86ad58-480.webp"},
    {type:"photo",title:"Golden Afternoon",src:"/test/media/cover-b14.webp"},
    {type:"photo",title:"The Everyday Edit",src:"/test/media/cover-b15.webp"},
    {type:"video",title:"A Day With Us",src:"/assets/home/entertainment-preview.mp4",poster:"/assets/home/entertainment-preview.webp"},
    {type:"photo",title:"Sunlit Stories",src:"/test/media/cover-b16.webp"},
    {type:"photo",title:"A Little More Blue",src:"/test/media/cover-b17.webp"},
    {type:"photo",title:"Sisters at Heart",src:"/test/media/cover-b18.webp"},
    {type:"video",title:"The Bluias Edit",src:"/assets/home/links-preview.mp4",poster:"/assets/home/links-preview.webp"},
    {type:"photo",title:"Quiet Confidence",src:"/test/media/cover-b19.webp"},
    {type:"photo",title:"The Last Look",src:"/test/media/cover-b20.webp"}
  ];
  const grid=document.getElementById("feed-grid");
  items.forEach(function(item,index){
    const card=document.createElement("article");
    card.className="story";
    const visual=document.createElement("div");
    visual.className="story-visual";
    let media;
    if(item.type==="video"){
      media=document.createElement("video");
      media.src=item.src;
      media.poster=item.poster;
      media.muted=true;
      media.loop=true;
      media.autoplay=true;
      media.playsInline=true;
      media.preload="metadata";
      media.setAttribute("aria-label",item.title);
    }else{
      media=document.createElement("img");
      media.src=item.src;
      media.alt=item.title;
      media.loading="lazy";
      media.decoding="async";
    }
    media.className="story-media";
    const shade=document.createElement("div");
    shade.className="story-shade";
    shade.innerHTML='<span class="lock-mark" aria-hidden="true">✦</span>';
    const type=document.createElement("span");
    type.className="type-pill";
    type.textContent=item.type;
    visual.append(media,shade,type);
    const copy=document.createElement("div");
    copy.className="story-copy";
    const title=document.createElement("h3");
    title.textContent=item.title;
    const caption=document.createElement("div");
    caption.className="post-caption";
    const captionLines=[
      ["A little sunshine to carry into the week.","Saving this moment for a rainy day."],
      ["Soft light, good company, easy afternoons.","A tiny reminder to enjoy the little things."],
      ["A new look, a familiar feeling.","Just us, making another lovely memory."],
      ["Blue skies and a slower kind of morning.","Some moments deserve a second look."],
      ["A little note from our side of the story.","Keeping the good energy close today."],
      ["A favorite frame from a favorite day.","More moments like this, please."],
      ["The best plans leave room for a detour.","A fresh page, a little sparkle."],
      ["Here’s to the in-between moments.","A small detail made the whole day."],
      ["A soft mood for a bright new week.","Take the long way when you can."],
      ["One of those days we want to remember.","Good things happen when we slow down."]
    ];
    const lines=captionLines[Math.floor(Math.random()*captionLines.length)];
    lines.forEach(function(line){const span=document.createElement("span");span.textContent=line;caption.appendChild(span);});
    copy.append(title,caption);
    card.append(visual,copy);
    grid.appendChild(card);
  });
  const tabs=[...document.querySelectorAll(".feed-tab")];
  tabs.forEach(function(tab){
    tab.addEventListener("click",function(){
      const isPro=tab.dataset.view==="pro";
      document.body.classList.toggle("pro-active",isPro);
      tabs.forEach(function(other){
        const selected=other===tab;
        other.classList.toggle("is-active",selected);
        other.setAttribute("aria-selected",String(selected));
      });
      grid.setAttribute("aria-labelledby",isPro?"pro-tab":"free-tab");
    });
  });
})();
</script>
</body>
</html>
