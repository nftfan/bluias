<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Bluia Sisters — photos, exclusive content, and Pro membership.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.bluias.com/">
  <meta property="og:site_name" content="Bluias">
  <meta property="og:title" content="BLUIA SISTERS">
  <meta property="og:description" content="Explore Bluia Sisters photos and Pro membership.">
  <meta property="og:image" content="https://huggingface.co/buckets/Bluia/albums/resolve/517F833D-B5AE-4E89-8EAF-BBC4FA2685A6.png?download=true">
  <meta property="og:image:secure_url" content="https://huggingface.co/buckets/Bluia/albums/resolve/517F833D-B5AE-4E89-8EAF-BBC4FA2685A6.png?download=true">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="Bluia Sisters cover photo">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BLUIA SISTERS">
  <meta name="twitter:description" content="Explore Bluia Sisters photos and Pro membership.">
  <meta name="twitter:image" content="https://huggingface.co/buckets/Bluia/albums/resolve/517F833D-B5AE-4E89-8EAF-BBC4FA2685A6.png?download=true">
  <link rel="canonical" href="https://www.bluias.com/">
  <title>BLUIA SISTERS</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}
    html{margin:0;background:#070707;scroll-behavior:smooth}
    body{margin:0;min-width:280px;min-height:100svh;background:#070707;color:#fff;overflow-x:hidden}
    .site-heading{display:grid;place-items:center;min-height:96px;padding:22px 12px;background:#050505;text-align:center;border-bottom:1px solid #33070b}
    .site-heading h1{margin:0;color:#ff2945;font-size:clamp(24px,6vw,49px);font-weight:950;line-height:1.1;letter-spacing:clamp(.06em,.8vw,.17em);text-shadow:0 0 6px #ff0b2e,0 0 18px #cf0024,0 0 32px #9e001c;animation:headline-glow 3s ease-in-out infinite alternate}
    @keyframes headline-glow{from{text-shadow:0 0 4px #ff0b2e,0 0 13px #be0024,0 0 20px #6a0015;filter:brightness(.87)}to{text-shadow:0 0 9px #ff4d65,0 0 27px #e3002a,0 0 47px #cf002c;filter:brightness(1.12)}}
    .top-cover{width:100%;margin:0;background:#0a0708}
    .top-cover img{display:block;width:100%;height:auto;max-height:82svh;object-fit:contain;object-position:center}
    .photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;width:100%;margin:0;padding:0;background:#0a0a0a}
    .photo-tile{position:relative;aspect-ratio:2/3;min-width:0;margin:0;overflow:hidden;background:linear-gradient(115deg,#1c0b0e,#310b13,#180608)}
    .photo-tile::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,#ffffff0d 50%,transparent 65%);transform:translateX(-110%);animation:skeleton-shimmer 1.9s linear infinite}
    .photo-tile.loaded::after,.photo-tile.failed::after{display:none}
    @keyframes skeleton-shimmer{to{transform:translateX(110%)}}
    .photo-tile img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity .28s ease}
    .photo-tile.loaded img{opacity:1}
    .photo-tile.failed{display:grid;place-items:center;color:#a88a90;font-size:12px}
    .gallery-sentinel{height:1px}
    @media(min-width:680px){.photo-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(min-width:1150px){.photo-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
    .subscription-fab{position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:inline-flex;align-items:center;justify-content:center;gap:11px;min-height:54px;padding:12px 19px;border:1px solid #ff3852;border-radius:999px;background:linear-gradient(125deg,#d20b2b,#96051a);color:#fff;font:850 14px/1.2 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;box-shadow:0 7px 25px #000b,0 0 18px #e90e3980;cursor:pointer;transition:transform .18s,box-shadow .18s}
    .subscription-fab:hover{transform:translateY(-3px);box-shadow:0 10px 30px #000c,0 0 25px #e90e39b3}
    .subscription-fab svg{width:22px;height:22px;flex:none}
    .subscription-fab:focus-visible,.subscribe-close:focus-visible,.payment-button:focus-visible{outline:3px solid #fff;outline-offset:3px}
    .subscription-modal{box-sizing:border-box;width:min(440px,calc(100vw - 28px));max-width:none;margin:auto;padding:0;border:1px solid #9d1b31;border-radius:20px;background:linear-gradient(145deg,#1c0a0e,#080708 74%);color:#fff;box-shadow:0 20px 85px #000d,0 0 35px #be092b38}
    .subscription-modal::backdrop{background:#000c;backdrop-filter:blur(6px)}
    .subscribe-inner{position:relative;padding:clamp(24px,6vw,35px);text-align:center}
    .subscribe-close{position:absolute;right:12px;top:12px;display:grid;place-items:center;width:39px;height:39px;border:1px solid #65202d;border-radius:50%;background:#2a1219;color:#fff;font-size:27px;line-height:1;cursor:pointer}
    .subscribe-mark{display:grid;place-items:center;width:64px;height:64px;margin:4px auto 18px;border:1px solid #ff4359;border-radius:18px;background:#6d0b20;color:#fff;box-shadow:0 0 27px #e6133d55}
    .subscribe-mark svg{width:35px;height:35px}
    .subscription-modal h2{margin:0 0 9px;font-size:clamp(23px,6vw,30px);letter-spacing:-.02em}
    .subscribe-price{margin:0 0 15px;color:#fff}
    .subscribe-price strong{font-size:41px;font-weight:950}
    .subscribe-price span{font-size:15px;color:#dcb0b8}
    .subscribe-description{max-width:335px;margin:0 auto 18px;color:#f0dce1;font-size:14px;line-height:1.65}
    .subscribe-note{margin:15px 0 0;color:#bca0a7;font-size:12px;line-height:1.6}
    .payment-button{display:flex;justify-content:center;align-items:center;min-height:52px;width:100%;padding:14px;border:1px solid #ff425b;border-radius:10px;background:#ce0d2c;color:#fff;text-align:center;text-decoration:none;font-size:15px;font-weight:850}
    .payment-button:hover{background:#f11b3c}
    @media(max-width:420px){.site-heading{min-height:79px;padding:17px 8px}.subscription-fab{padding:11px 15px;min-height:50px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.site-heading h1,.photo-tile::after{animation:none}.subscription-fab,.photo-tile img{transition:none}}
  </style>
</head>
<body>
  <main>
    <header class="site-heading"><h1>BLUIA SISTERS</h1></header>
    <section class="top-cover" aria-label="Bluia Sisters cover">
      <img src="https://huggingface.co/buckets/Bluia/albums/resolve/517F833D-B5AE-4E89-8EAF-BBC4FA2685A6.png?download=true" alt="Bluia Sisters cover photo" fetchpriority="high" decoding="async">
    </section>
    <section class="photo-grid" id="photo-grid" aria-label="Bluia Sisters photo gallery"></section>
    <div id="gallery-sentinel" class="gallery-sentinel" aria-hidden="true"></div>
  </main>

  <button id="subscription-fab" type="button" class="subscription-fab" aria-haspopup="dialog" aria-controls="subscription-modal" aria-label="Open Pro membership subscription">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8.2 7 12l5-7 5 7 4.5-3.8-2 11.3h-15L2.5 8.2Z"/><path d="M6.5 22h11"/></svg>
    <span>Subscribe</span>
  </button>

  <dialog id="subscription-modal" class="subscription-modal" aria-labelledby="subscribe-title">
    <div class="subscribe-inner">
      <button id="subscribe-close" type="button" class="subscribe-close" aria-label="Close subscription details">&times;</button>
      <div class="subscribe-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.2 7 12l5-7 5 7 4.5-3.8-2 11.3h-15L2.5 8.2Z"/><path d="M6.5 22h11"/></svg>
      </div>
      <h2 id="subscribe-title">Bluia Sisters Pro</h2>
      <p class="subscribe-price"><strong>$10</strong> <span>/ month</span></p>
      <p class="subscribe-description">Subscribe for exclusive Bluia Sisters photos and videos. Explore more content with Pro membership.</p>
      <a class="payment-button" href="https://buy.stripe.com/8x23cnbA49TM1yFgrRbAs06" target="_blank" rel="noopener noreferrer">Subscribe &amp; Pay $10/month</a>
      <p class="subscribe-note">Secure checkout via Stripe. Follow the access instructions provided after your payment.</p>
    </div>
  </dialog>

  <script>
    (function(){
      "use strict";
      const photos=["https://huggingface.co/buckets/Bluia/albums/resolve/IMG_9820.png?download=true","https://huggingface.co/buckets/Bluia/albums/resolve/IMG_9818.png?download=true","https://huggingface.co/buckets/Bluia/albums/resolve/IMG_9816.png?download=true","https://huggingface.co/buckets/Bluia/albums/resolve/156F4FF5-5B53-4DDA-BCEC-5EA625D51269.png","https://huggingface.co/buckets/Bluia/albums/resolve/419010DC-D3C8-4DCB-8E55-E3476DCBD8C0.png","https://huggingface.co/buckets/Bluia/albums/resolve/6BC3F2CF-CCCE-4AB0-8692-90B649C225F8.png","https://huggingface.co/buckets/Bluia/albums/resolve/7EE2EF45-E9FB-48CB-825E-E9C4081E0DFE.png","https://huggingface.co/buckets/Bluia/albums/resolve/998032C2-129A-4CE8-9785-F7D6D18DB688.png","https://huggingface.co/buckets/Bluia/albums/resolve/A2A33852-D6FE-4562-8309-698488B0CAE9.png","https://huggingface.co/buckets/Bluia/albums/resolve/BF6DABCA-21A4-41DE-A634-EFC27F3FCEAD.png"];
      const grid=document.getElementById("photo-grid");
      const sentinel=document.getElementById("gallery-sentinel");
      let index=0;
      let observer=null;
      function appendNext(){
        const limit=Math.min(index+4,photos.length);
        const fragment=document.createDocumentFragment();
        for(;index<limit;index++){
          const tile=document.createElement("figure");
          tile.className="photo-tile";
          const image=document.createElement("img");
          image.alt="Bluia Sisters photo "+(index+1);
          image.loading="lazy";
          image.decoding="async";
          image.src=photos[index];
          image.addEventListener("load",()=>tile.classList.add("loaded"),{once:true});
          image.addEventListener("error",()=>{tile.classList.add("failed");tile.textContent="Photo unavailable";},{once:true});
          if(image.complete&&image.naturalWidth>0)tile.classList.add("loaded");
          tile.appendChild(image);
          fragment.appendChild(tile);
        }
        grid.appendChild(fragment);
        if(index===photos.length){if(observer)observer.disconnect();sentinel.remove();}
      }
      appendNext();
      if(index<photos.length){
        if("IntersectionObserver" in window){
          observer=new IntersectionObserver(entries=>{
            if(entries.some(entry=>entry.isIntersecting))appendNext();
          },{rootMargin:"750px 0px",threshold:0});
          observer.observe(sentinel);
        }else{
          while(index<photos.length)appendNext();
        }
      }
      const dialog=document.getElementById("subscription-modal");
      const open=document.getElementById("subscription-fab");
      const close=document.getElementById("subscribe-close");
      open.addEventListener("click",()=>dialog.showModal());
      close.addEventListener("click",()=>dialog.close());
      dialog.addEventListener("click",event=>{if(event.target===dialog)dialog.close();});
    })();
  </script>
</body>
</html>
