<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Bluias</title>
  <style>
    html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    body{min-height:100svh;display:grid;place-items:center}
    .boot{font-size:11px;font-weight:800;letter-spacing:.5px;color:#ff9bc1}
  </style>
</head>
<body>
  <div class="boot">Loading Bluias…</div>
  <script>
  (async()=>{
    try{
      const response=await fetch('/index-original.html?v=20261021-bluias',{cache:'no-store'});
      if(!response.ok)throw new Error('Could not load site');
      let html=await response.text();
      html=html.replaceAll('Bluia Sisters','Bluias');

      const navigationUpgrade=`
<style id="bluias-scroll-tabs-and-telegram">
  .topnav{
    display:flex!important;
    grid-template-columns:none!important;
    align-items:center;
    gap:7px!important;
    width:100%;
    overflow-x:auto!important;
    overflow-y:hidden!important;
    white-space:nowrap;
    scroll-snap-type:x proximity;
    scroll-padding-inline:10px;
    overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    -ms-overflow-style:none;
    padding:8px 10px 9px!important;
  }
  .topnav::-webkit-scrollbar{display:none}
  .nav-btn{
    flex:0 0 auto!important;
    min-width:96px;
    padding:0 14px;
    scroll-snap-align:start;
  }
  .nav-btn[data-panel="updates"]{min-width:112px}
  .nav-btn[data-panel="telegram"]{
    background:linear-gradient(135deg,#2aabee,#1477aa);
    border-color:#54c7ff;
    color:#fff;
    box-shadow:0 6px 20px rgba(42,171,238,.22);
  }
  .nav-btn[data-panel="telegram"].active{
    background:linear-gradient(135deg,#56c8ff,#1687c2);
    border-color:#a4e4ff;
    color:#fff;
    box-shadow:0 7px 24px rgba(42,171,238,.4);
  }
  #panel-telegram{background:radial-gradient(ellipse at 50% 0%,#102331 0%,#080a10 40%,#000 75%)}
  .telegram-page{width:min(100%,520px);margin:0 auto;padding:40px 20px 48px;text-align:left}
  .telegram-page *{box-sizing:border-box}
  .telegram-eyebrow{color:#79cfff;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
  .telegram-page h1{font-size:32px;line-height:1.12;letter-spacing:-1px;margin:12px 0;color:#fff}
  .telegram-intro{font-size:13px;line-height:1.7;color:#a3b1bf;margin:0 0 26px}
  .telegram-page-buttons{display:grid;gap:12px}
  .telegram-page-link{display:grid;grid-template-columns:46px minmax(0,1fr) 20px;align-items:center;gap:14px;padding:22px 18px;border-radius:22px;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease}
  .telegram-page-link:hover{transform:translateY(-3px);box-shadow:0 14px 40px #0006}
  .telegram-page-link:active{transform:scale(.985)}
  .telegram-page-link:focus-visible,.telegram-wallet-copy:focus-visible{outline:3px solid #fff;outline-offset:4px}
  .telegram-page-free{background:linear-gradient(130deg,#123f59,#0b2437);border:1px solid #3287b0;color:#8cdeff}
  .telegram-page-pro{background:linear-gradient(130deg,#40331a,#211b10);border:1px solid #9d803b;color:#ffe298}
  .telegram-card-icon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#ffffff12;border:1px solid #ffffff20}
  .telegram-card-icon svg{width:24px;height:24px;fill:currentColor}
  .telegram-card-copy{display:flex;flex-direction:column;gap:7px;min-width:0}
  .telegram-card-copy strong{font-size:17px;line-height:1.2;color:#fff}
  .telegram-card-copy small{font-size:11px;line-height:1.5;color:inherit}
  .telegram-card-cta{font-size:12px;font-weight:800;margin-top:7px}
  .telegram-card-arrow{font-size:22px}
  .telegram-support{margin-top:28px;padding:24px 20px 16px;border:1px solid #534066;border-radius:22px;background:radial-gradient(ellipse at 100% 0%,#362445,#17131d 70%)}
  .telegram-support-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .telegram-support-label{font-size:10px;font-weight:800;letter-spacing:1.6px;color:#d2afe9;text-transform:uppercase}
  .telegram-gram-badge{font-size:11px;font-weight:800;border:1px solid #826195;background:#c695e91a;border-radius:20px;padding:6px 10px;color:#e6c8ff}
  .telegram-support h2{font-size:22px;letter-spacing:-.5px;margin:16px 0 8px;color:#fff}
  .telegram-support p{font-size:12px;line-height:1.7;color:#b9aabe;margin:0 0 20px}
  .telegram-wallet-label{display:block;font-size:10px;color:#c8b8d1;margin-bottom:8px}
  .telegram-wallet-address{display:block;width:100%;font:11px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;color:#e6dbef;overflow-wrap:anywhere;user-select:all;background:#0004;border:1px solid #ffffff12;border-radius:12px;padding:12px}
  .telegram-wallet-copy{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:46px;margin-top:12px;border:1px solid #ddbcf6;border-radius:12px;background:linear-gradient(120deg,#e7c5ff,#bc9de9);color:#241331;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:filter .18s ease}
  .telegram-wallet-copy:hover{filter:brightness(1.1)}
  .telegram-wallet-copy svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7}
  .telegram-wallet-status{min-height:28px;padding-top:9px;font-size:11px;line-height:1.6;text-align:center;color:#dac7e8}
  .telegram-page-moms{background:linear-gradient(130deg,#38234c,#1b1228);border:1px solid #a67bcd;color:#d9b9f7}
  #panel-members .moms-wrap{width:100%;padding:24px 0 0}
  #panel-members #moms-membership-card{padding:0;overflow:hidden;border-radius:22px;border-color:#75416b;background:linear-gradient(180deg,#21101c,#0c090d);box-shadow:0 16px 42px #0005}
  .moms-plan-cover{display:block;width:100%;height:auto;margin:0;border-bottom:1px solid #75416b;background:#1b1119}
  .moms-plan-details{padding:22px 18px 20px}
  #panel-moms{padding-bottom:90px}
  #moms-membership-float{border-color:#b78bdf;color:#e4c5ff;background:linear-gradient(135deg,#392449,#1d1327);bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  #moms-membership-float:focus-visible{outline:2px solid #e4c5ff;outline-offset:4px}
  @media(max-width:380px){
    .nav-btn{min-width:92px;padding:0 12px}
    .nav-btn[data-panel="updates"]{min-width:108px}
  }
  @media(prefers-reduced-motion:reduce){
    .telegram-page-link{transition:none!important}
  }
</style>`;

      html=html.replace('</head>',navigationUpgrade+'\n</head>');

      const momsTab='<button class="nav-btn" data-panel="moms" type="button">Moms</button>';
      const telegramTab='<button class="nav-btn" data-panel="telegram" type="button">Telegram</button>';
      html=html.replace(momsTab,telegramTab+'\n    '+momsTab);

      const momsPanel='<section class="panel" id="panel-moms">';
      const wallet='UQARGmizoioMOOE6MqPTMwGr1aVL8M36rq6W0Uds2cOC9ODk';
      const plane='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 3.4 18.4 19c-.2 1.1-.9 1.4-1.8.9l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L5.9 12.8 1 11.3c-1.1-.3-1.1-1.1.2-1.6L20.3 2.3c.9-.3 1.7.2 1.3 1.1Z"/></svg>';
      const telegramPanel=`<section class="panel" id="panel-telegram" aria-labelledby="telegram-heading">
        <div class="telegram-page">
          <div class="telegram-eyebrow">The Bluias community</div>
          <h1 id="telegram-heading">Closer on Telegram.</h1>
          <p class="telegram-intro">Your place to stay connected with Bluias. Join the community or make it Pro.</p>
          <div class="telegram-page-buttons">
            <a class="telegram-page-link telegram-page-free" href="https://t.me/vbluia" target="_blank" rel="noopener noreferrer">
              <span class="telegram-card-icon">${plane}</span>
              <span class="telegram-card-copy"><strong>Free Telegram</strong><small>Stay connected with the community.</small><span class="telegram-card-cta">Join for free</span></span>
              <span class="telegram-card-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="telegram-page-link telegram-page-pro" href="https://t.me/+vieXRo_X9rM5NzRk" target="_blank" rel="noopener noreferrer">
              <span class="telegram-card-icon">${plane}</span>
              <span class="telegram-card-copy"><strong>Pro Telegram</strong><small>Your invitation to the private channel.</small><span class="telegram-card-cta">Explore Pro</span></span>
              <span class="telegram-card-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="telegram-page-link telegram-page-moms" href="https://t.me/mbluia" target="_blank" rel="noopener noreferrer">
              <span class="telegram-card-icon">${plane}</span>
              <span class="telegram-card-copy"><strong>Bluia Moms Telegram</strong><small>The exclusive Bluia Moms channel.</small><span class="telegram-card-cta">Join Bluia Moms</span></span>
              <span class="telegram-card-arrow" aria-hidden="true">↗</span>
            </a>
          </div>
          <section class="telegram-support" aria-labelledby="telegram-support-heading">
            <div class="telegram-support-top"><span class="telegram-support-label">A little love goes a long way</span><span class="telegram-gram-badge">$GRAM</span></div>
            <h2 id="telegram-support-heading">Support Bluias with $GRAM</h2>
            <p>Love what we create? Send a little $GRAM our way. Thank you for supporting Bluias.</p>
            <span class="telegram-wallet-label">Our wallet address</span>
            <code class="telegram-wallet-address" id="telegram-wallet-address">${wallet}</code>
            <button class="telegram-wallet-copy" id="telegram-wallet-copy" type="button" aria-describedby="telegram-wallet-status"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg><span>Copy wallet address</span></button>
            <div class="telegram-wallet-status" id="telegram-wallet-status" role="status" aria-live="polite"></div>
          </section>
        </div>
      </section>`;
      html=html.replace(momsPanel,telegramPanel+'\n    '+momsPanel);

      html=html.replace("['members','moms'].includes(btn.dataset.panel)","['members','moms','telegram'].includes(btn.dataset.panel)");

      // Keep subscription options in Members and channel links in Telegram.
      html=html.replace(/<div class="telegram-stack">[\s\S]*?<\/div>/g,'');
      html=html.replace(/<a class="moms-telegram"[\s\S]*?<\/a>/g,'');
      let momsPricing='';
      html=html.replace(/(<section class="panel" id="panel-moms">)([\s\S]*?)(<\/section>)/,(_,open,body,close)=>{
        const pricingStart=body.indexOf('<div class="moms-wrap">');
        if(pricingStart<0)return open+body+close;
        momsPricing=body.slice(pricingStart)
          .replace('<div class="moms-card">','<div class="moms-card" id="moms-membership-card"><img class="moms-plan-cover" src="https://huggingface.co/buckets/veebluia/bluiaimages/resolve/Golden-Hour%20Countryside%20Group%20Portrait.png?download=true" alt="Bluia Moms countryside group portrait" loading="lazy" decoding="async"><div class="moms-plan-details">')
          .replace(/<\/div><\/div>\s*$/,'</div></div></div>');
        return open+body.slice(0,pricingStart)+'<button class="feed-membership-float" id="moms-membership-float" type="button">Unlock Bluia Moms — $10/month</button>'+close;
      });
      html=html.replace(/(<section class="panel" id="panel-members">[\s\S]*?)(<\/div><\/section>)/,(_,body,end)=>body+momsPricing+end);

      document.open();
      document.write(html);
      document.close();
      document.getElementById('moms-membership-float')?.addEventListener('click',()=>{
        document.querySelector('.nav-btn[data-panel="members"]')?.click();
        document.getElementById('moms-membership-card')?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});
      });
      const copyButton=document.getElementById('telegram-wallet-copy');
      const copyStatus=document.getElementById('telegram-wallet-status');
      copyButton.addEventListener('click',async()=>{
        let copied=false;
        try{
          await navigator.clipboard.writeText(wallet);
          copied=true;
        }catch(error){
          const field=document.createElement('textarea');
          field.value=wallet;
          field.setAttribute('readonly','');
          field.style.cssText='position:fixed;top:0;left:-9999px';
          document.body.appendChild(field);
          field.select();
          field.setSelectionRange(0,wallet.length);
          try{copied=document.execCommand('copy');}catch(error){}
          field.remove();
          copyButton.focus();
        }
        copyButton.querySelector('span').textContent=copied?'Copied!':'Copy wallet address';
        copyStatus.textContent=copied?'Wallet address copied. Thank you for your support!':'Could not copy. Select and copy the wallet address above.';
      });
    }catch(error){
      document.body.innerHTML='<div style="padding:30px;text-align:center;color:#fff;font:12px Inter,Arial,sans-serif">Bluias could not load. Please refresh the page.</div>';
    }
  })();
  </script>
<!-- Visitor notifications require a server-side endpoint; do not embed bot credentials here. -->
</body>
</html>
