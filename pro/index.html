<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Bluias Pro</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100svh;overflow:hidden}
.pro-boot{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 45%,rgba(242,92,154,.10),transparent 42%),#000}
.feed-startup-title{color:#ffe7f1;font:800 13px/1 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:.7px;text-shadow:0 0 18px rgba(242,92,154,.42)}
.feed-startup-bar{width:min(62vw,240px);height:4px;border-radius:999px;overflow:hidden;background:#241019;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.feed-startup-progress{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#b82d69,#ff79ad,#ffd3e4);box-shadow:0 0 14px rgba(255,89,154,.72);animation:startupBar 1.15s cubic-bezier(.4,0,.2,1) infinite}
@keyframes startupBar{0%{transform:translateX(-115%)}60%,100%{transform:translateX(250%)}}
@media(prefers-reduced-motion:reduce){.feed-startup-progress{animation:none!important;transform:none!important;width:100%!important}}
</style>
</head>
<body>
<div class="pro-boot" aria-label="Loading Bluias Pro">
  <div class="feed-startup-title">Loading Bluias</div>
  <div class="feed-startup-bar" aria-hidden="true"><span class="feed-startup-progress"></span></div>
</div>
<script>
(async()=>{
  try{
    const response=await fetch('/pro/index-original.html?v=20261021-bluias-pro',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load Pro page');
    let html=await response.text();

    html=html.replaceAll('Bluia Sisters','Bluias');

    const oldStartup='<div class="feed-startup" id="feed-startup"><span></span><span></span><span></span></div>';
    const newStartup='<div class="feed-startup" id="feed-startup" aria-label="Loading Bluias"><div class="feed-startup-title">Loading Bluias</div><div class="feed-startup-bar" aria-hidden="true"><span class="feed-startup-progress"></span></div></div>';
    html=html.replace(oldStartup,newStartup);

    const loaderUpgrade=`
<style id="bluias-pro-loading-upgrade">
.feed-startup{
  height:168px!important;
  display:flex!important;
  flex-direction:column!important;
  align-items:center!important;
  justify-content:center!important;
  gap:14px!important;
  background:radial-gradient(circle at 50% 45%,rgba(242,92,154,.10),transparent 42%),#000!important;
  transition:opacity .65s ease,height .65s cubic-bezier(.2,.7,.2,1)!important;
  overflow:hidden!important;
}
.feed-startup.done{opacity:0!important;height:0!important;pointer-events:none!important}
.feed-startup-title{color:#ffe7f1!important;font:800 13px/1 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif!important;letter-spacing:.7px!important;text-shadow:0 0 18px rgba(242,92,154,.42)!important}
.feed-startup-bar{width:min(62vw,240px)!important;height:4px!important;border-radius:999px!important;overflow:hidden!important;background:#241019!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)!important}
.feed-startup .feed-startup-progress{display:block!important;width:42%!important;height:100%!important;border-radius:inherit!important;background:linear-gradient(90deg,#b82d69,#ff79ad,#ffd3e4)!important;box-shadow:0 0 14px rgba(255,89,154,.72)!important;animation:bluiasStartupBar 1.15s cubic-bezier(.4,0,.2,1) infinite!important}
@keyframes bluiasStartupBar{0%{transform:translateX(-115%)}60%,100%{transform:translateX(250%)}}
@media(prefers-reduced-motion:reduce){.feed-startup .feed-startup-progress{animation:none!important;transform:none!important;width:100%!important}}
</style>`;
    html=html.replace('</head>',loaderUpgrade+'\n</head>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div style="min-height:100svh;display:grid;place-items:center;padding:30px;text-align:center;color:#fff;font:12px Inter,Arial,sans-serif">Bluias Pro could not load. Please refresh the page.</div>';
  }
})();
</script>
</body>
</html>
